[project]
name = "aria-sheets-table"
version = "1.4.0"
description = "The table a Google Sheets range makes (header, blank rows, column names); shared by tap-googlesheetsrange and the Aria runner."
requires-python = ">=3.9"
dependencies = []

[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["sheets_table.py"]
